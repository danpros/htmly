          el = '''editorial_language = "Γλώσσα"\neditorial_skip_to_content = "Μετάβαση στο περιεχόμενο"\neditorial_primary_navigation = "Κύρια πλοήγηση"\neditorial_toggle_menu = "Εναλλαγή μενού"\neditorial_toggle_dark_mode = "Εναλλαγή σκοτεινής λειτουργίας"\neditorial_toggle_search = "Εναλλαγή αναζήτησης"\neditorial_explore = "Περιήγηση"\neditorial_home = "Αρχική"\neditorial_rss_feed = "Ροή RSS"\neditorial_categories = "Κατηγορίες"\neditorial_theme = "Θέμα"\neditorial_back_to_top = "Επιστροφή στην κορυφή"\neditorial_browsing = "Περιήγηση"\neditorial_read_more = "Διαβάστε περισσότερα"\neditorial_about = "για"\neditorial_sidebar = "Πλευρική στήλη"\neditorial_search = "Αναζήτηση"\neditorial_go = "Αναζήτηση"\neditorial_recent_posts = "Πρόσφατα άρθρα"\neditorial_popular = "Δημοφιλή"\neditorial_views = "προβολές"\neditorial_advertisement = "Διαφήμιση"\neditorial_tags = "Ετικέτες"\neditorial_sponsors = "Χορηγοί"\neditorial_sponsored = "Χορηγούμενο"\neditorial_archive = "Αρχείο"\neditorial_breadcrumb = "Διαδρομή πλοήγησης"\neditorial_edit_post = "Επεξεργασία άρθρου"\neditorial_updated = "ενημερώθηκε"\neditorial_visit_link = "Επίσκεψη συνδέσμου"\neditorial_filed_under = "Κατηγορία"\neditorial_tagged = "Ετικέτες"\neditorial_share_this_post = "Κοινοποίηση άρθρου"\neditorial_share_on_x = "Κοινοποίηση στο X"\neditorial_share_on_facebook = "Κοινοποίηση στο Facebook"\neditorial_share_via_email = "Κοινοποίηση μέσω email"\neditorial_related_posts = "Σχετικά άρθρα"\neditorial_post_navigation = "Πλοήγηση άρθρων"\neditorial_previous = "Προηγούμενο"\neditorial_next = "Επόμενο"\neditorial_edit_page = "Επεξεργασία σελίδας"\n'''
          write('themes/editorial/lang/en_US.ini', en)
          write('themes/editorial/lang/el_GR.ini', el)

          docs = r'''# Native-like multilingual HTMLy

          This fork supports language-prefixed content without cookies or query strings.

          ## URL model

          - Greek is the default language and stays at the root: `/`, `/category/...`, `/2026/09/...`.
          - English uses `/en/`: `/en/`, `/en/category/...`, `/en/2026/09/...`.
          - A request under `/el/...` is permanently redirected to the equivalent root URL.
          - Additional languages are enabled by configuration; the mechanism is not hard-coded to two languages.

          ## Content metadata

          Existing files without a language tag remain Greek automatically.

          English article or static page:

          ```markdown
          <!--lang en lang-->
          <!--translation olympus-development translation-->
          <!--t English title t-->
          <!--d English meta description d-->

          Content...
          ```

          Greek counterpart:

          ```markdown
          <!--lang el lang-->
          <!--translation olympus-development translation-->
          <!--t Ελληνικός τίτλος t-->
          <!--d Ελληνική meta description d-->

          Περιεχόμενο...
          ```

          `translation` is a stable group ID. Every translation of the same logical page/article uses the same ID. Adding a third language does not require editing the older files.

          ## Static pages

          HTMLy keeps static pages in `content/static/`. Different files can have different localized slugs, for example:

          - `01.sxetika.md` -> `/sxetika`
          - `02.about.md` with `<!--lang en lang-->` -> `/en/about`

          The language filter runs before page lookup and before automatic static-page menus are built.

          ## Posts, categories and tags

          The language filter is applied to the raw post index before pagination, category/tag/archive/search counts, related posts, RSS and sitemap generation. English posts may live in localized category folders (recommended), e.g. `epikairotita` for Greek and `current-affairs` for English.

          ## SEO

          Editorial emits:

          - localized canonical URLs,
          - `hreflang` alternates for translations that actually exist,
          - `x-default` pointing to the default-language translation,
          - a dynamic `<html lang="...">`.

          The language switcher sends the visitor directly to the translated sibling when a matching `translation` ID exists. If that translation does not exist, it sends the visitor to that language's homepage rather than inventing a non-existent URL.

          ## Configuration

          The feature defaults to Greek + English even when an older `config/config.ini` has no multilingual keys. To make it explicit, add:

          ```ini
          multilingual.enabled = "true"
          multilingual.default = "el"
          multilingual.languages = "el:el_GR,en:en_US"
          multilingual.language_names = "el:Ελληνικά,en:English"
          ```

          To add Italian later:

          ```ini
          multilingual.languages = "el:el_GR,en:en_US,it:it_IT"
          multilingual.language_names = "el:Ελληνικά,en:English,it:Italiano"
          ```

          Add `themes/editorial/lang/it_IT.ini` for Editorial UI strings and mark Italian content with `<!--lang it lang-->`.

          Optional localized site identity values use language suffixes and fall back to the existing global HTMLy setting:

          ```ini
          blog.title.en = "English site title"
          blog.tagline.en = "English tagline"
          blog.description.en = "English site description"
          breadcrumb.home.en = "Home"
          ```

          ## Cache behavior

          Full-page cache remains naturally language-safe because `/...` and `/en/...` have different request URIs. Widget caches (recent posts, categories, tags, archives, popular posts) receive a language suffix so content cannot leak across languages.

          ## Core footprint

          The multilingual logic lives in `system/custom/multilingual.php`. Core changes are deliberately limited to small hooks in the index getters and dispatcher. This keeps future upstream HTMLy merges reviewable.
          '''
          docs = re.sub(r'^          ', '', docs, flags=re.M)
          write('MULTILINGUAL.md', docs)
          PY

