          <?php
          define('HTMLY', true);
          $cfg = array('site.url' => 'https://example.test/', 'multilingual.enabled' => 'true');
          function config($key, $value = null) { global $cfg; if ($value === null) return $cfg[$key] ?? null; $cfg[$key] = $value; return $value; }
          function generateSiteUrl() { return 'https://example.test/'; }
          function get_content_tag($tag, $content, $alt = null) { if (preg_match('/<!--' . preg_quote($tag, '/') . '(.+)' . preg_quote($tag, '/') . '-->/', $content, $m)) return trim($m[1]); return $alt; }
          function permalink_type() { return 'default'; }
          $_SERVER['REQUEST_URI'] = '/en/2026/09/example';
          $_SERVER['QUERY_STRING'] = '';
          require 'system/custom/multilingual.php';
          multilingual_bootstrap_request();
          if (multilingual_current_language() !== 'en') exit(10);
          if (config('language') !== 'en_US') exit(11);
          if (config('site.url') !== 'https://example.test/en/') exit(12);
          if (multilingual_asset_site_url() !== 'https://example.test/') exit(13);
          echo "multilingual smoke test: OK\n";
